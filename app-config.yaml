app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000

organization:
  name: YOUR_ORG_NAME, Inc.

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  # Using PostgreSQL instead of better-sqlite3 to avoid Node.js version compatibility issues
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST:-localhost}
      port: ${POSTGRES_PORT:-5432}
      user: ${POSTGRES_USER:-backstage}
      password: ${POSTGRES_PASSWORD:-backstage}
      database: ${POSTGRES_DB:-backstage_plugin_catalog}
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}
  
  # Azure DevOps Integration
  azure:
    - host: dev.azure.com
      token: ${AZURE_DEVOPS_TOKEN}

  # GitLab Integration (OpenShift Iterate Service template için)
  gitlab:
    - host: gitlab.com
      token: ${GITLAB_TOKEN}
    # Self-hosted için örnek:
    # - host: YOUR_GITLAB_HOST
    #   token: ${GITLAB_TOKEN}
    #   apiBaseUrl: https://YOUR_GITLAB_HOST/api/v4

# Harbor Registry Configuration
harbor:
  url: ${HARBOR_URL:-https://YOUR_HARBOR_HOST}
  username: ${HARBOR_USERNAME}
  password: ${HARBOR_PASSWORD}

proxy: {}
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

# Auth configuration
auth:
  providers:
    guest: {}

scaffolder: {}
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Template]
  locations:
    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../examples/entities.yaml

    # System definitions (organizational structure)
    - type: file
      target: ../../examples/systems.yaml
      rules:
        - allow: [System]

    # Resource definitions (infrastructure)
    - type: file
      target: ../../examples/resources.yaml
      rules:
        - allow: [Resource]

    # Component definitions artık k8s-orchestration klasöründen geliyor
    # Örnek components.yaml kaldırıldı - gerçek mikroservisler kullanılıyor

    # API definitions
    - type: file
      target: ../../examples/apis.yaml
      rules:
        - allow: [API]

    # Local example template
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    # Azure DevOps Microservice Template
    - type: file
      target: ../../examples/templates/microservice-azure-devops/template.yaml
      rules:
        - allow: [Template]

    # Regulated Microservice (Azure DevOps) Template
    - type: file
      target: ../../examples/templates/regulated-microservice-azure-devops/template.yaml
      rules:
        - allow: [Template]

    # OpenShift Iterate Service Template (repo aç + OpenShift Iterate'e deploy)
    - type: file
      target: ../../examples/templates/openshift-iterate-service/template.yaml
      rules:
        - allow: [Template]

    # Domain definitions
    - type: file
      target: ../../examples/domains.yaml
      rules:
        - allow: [Domain]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    # Team and user definitions
    - type: file
      target: ../../examples/teams.yaml
      rules:
        - allow: [User, Group]

    # k8s-orchestration microservices (2/2 deployment'lar)
    # Tüm catalog-info.yaml dosyaları backstage-demo/examples/k8s-orchestration/ altında
    - type: file
      target: ../../examples/k8s-orchestration/cloud-account-mgmt.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/cluster-mgmt.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/headlamp-proxy.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/kubeapps-proxy.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/audit-mgmt.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/authn.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/authz.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/customer-mgmt.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/infrastructure-mgmt.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/integration-mgmt.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/job-management.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/notification-mgmt.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/organization-mgmt.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/permission-mgmt.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/quota-mgmt.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/role-mgmt.yaml
      rules:
        - allow: [Component]
    
    - type: file
      target: ../../examples/k8s-orchestration/user-group-mgmt.yaml
      rules:
        - allow: [Component]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

kubernetes:
  # Kubernetes plugin configuration
  # See https://backstage.io/docs/features/kubernetes/configuration
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        # Dev Cluster (Azure AKS - France Central)
        # Token yoksa bu cluster devre dışı kalır (local development için app-config.local.yaml kullan)
        - url: ${DEV_CLUSTER_URL:-https://YOUR_DEV_CLUSTER_API_URL}
          name: dev-cluster
          authProvider: 'serviceAccount'
          serviceAccountToken: ${DEV_CLUSTER_TOKEN}
          skipTLSVerify: true
          skipMetricsLookup: false
          dashboardUrl: ${DEV_CLUSTER_DASHBOARD:-https://portal.azure.com}
          dashboardApp: 'azure'
          # caData: ${DEV_CLUSTER_CA_DATA}  # Uncomment if using custom CA
        
        # Test Cluster
        - url: ${TEST_CLUSTER_URL:-https://YOUR_API_HOST}
          name: test-cluster
          authProvider: 'serviceAccount'
          serviceAccountToken: ${TEST_CLUSTER_TOKEN:-}
          skipTLSVerify: true
          dashboardUrl: ${TEST_CLUSTER_DASHBOARD:-https://rancher.company.com/c/test-cluster}
        
        # Prod Cluster
        - url: ${PROD_CLUSTER_URL:-https://api.prod-cluster.company.com}
          name: prod-cluster
          authProvider: 'serviceAccount'
          serviceAccountToken: ${PROD_CLUSTER_TOKEN:-}
          skipTLSVerify: true
          dashboardUrl: ${PROD_CLUSTER_DASHBOARD:-https://rancher.company.com/c/prod-cluster}
          dashboardApp: 'rancher'

        # OpenShift Iterate Cluster
        - url: ${OPENSHIFT_ITERATE_URL:-https://api.iterate.openshift.example.com:6443}
          name: iterate
          authProvider: 'serviceAccount'
          serviceAccountToken: ${OPENSHIFT_ITERATE_TOKEN:-}
          skipTLSVerify: true
          dashboardUrl: ${OPENSHIFT_ITERATE_DASHBOARD:-https://console.openshift.iterate.example.com}
          dashboardApp: 'openshift'
  
  # Custom resources to show (e.g., ArgoCD Applications)
  customResources:
    - group: 'argoproj.io'
      apiVersion: 'v1alpha1'
      plural: 'applications'

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: backstage
type: Opaque
stringData:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  POSTGRES_HOST: "YOUR_POSTGRES_HOST"         # e.g. postgres.backstage.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "YOUR_POSTGRES_USER"
  POSTGRES_PASSWORD: "YOUR_POSTGRES_PASSWORD"
  POSTGRES_DB: "backstage_plugin_catalog"

  # ── SCM Integrations ────────────────────────────────────────────────────────
  GITHUB_TOKEN: "YOUR_GITHUB_PAT"             # Required scopes: repo, read:org
  AZURE_DEVOPS_TOKEN: "YOUR_AZURE_DEVOPS_PAT"
  AZURE_DEVOPS_ORG: "YOUR_AZURE_ORG_NAME"

  # ── Kubernetes Cluster Tokens ───────────────────────────────────────────────
  # Retrieve: kubectl get secret backstage-sa-token -n backstage \
  #             -o jsonpath='{.data.token}' | base64 -d
  DEV_CLUSTER_URL: "YOUR_DEV_CLUSTER_API_URL"
  DEV_CLUSTER_TOKEN: "YOUR_DEV_CLUSTER_SA_TOKEN"

  TEST_CLUSTER_URL: "YOUR_TEST_CLUSTER_API_URL"
  TEST_CLUSTER_TOKEN: "YOUR_TEST_CLUSTER_SA_TOKEN"

  PROD_CLUSTER_URL: "YOUR_PROD_CLUSTER_API_URL"
  PROD_CLUSTER_TOKEN: "YOUR_PROD_CLUSTER_SA_TOKEN"

  # ── Backend Auth ────────────────────────────────────────────────────────────
  # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
  BACKEND_SECRET: "YOUR_RANDOM_32_BYTE_HEX_SECRET"

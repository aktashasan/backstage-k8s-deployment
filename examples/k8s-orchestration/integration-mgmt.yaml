apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: integration-mgmt
  title: Integration Management
  description: Service integration and API gateway management service
  tags:
    - microservice
    - integration
    - api-gateway
    - management
  annotations:
    backstage.io/kubernetes-id: crystal-integration-mgmt
    backstage.io/kubernetes-namespace: crystal
    backstage.io/kubernetes-label-selector: 'app=integration-mgmt'
    backstage.io/techdocs-ref: dir:.
    prometheus.io/scrape: 'true'
    prometheus.io/port: '3000'
  links:
    - url: https://YOUR_GITLAB_NAMESPACE/integration-mgmt
      title: Source Code
      icon: code
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: microservices-platform
  providesApis:
    - api:default/integration-api
  dependsOn:
    - resource:postgresql-shared

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backstage

resources:
  # Namespace
  - namespace.yaml

  # Harbor registry pull secret (imagePullSecrets için zorunlu)
  - harbor-registry-secret.yaml

  # RBAC — Backstage ServiceAccount + ClusterRole for OpenShift cluster access
  - rbac/serviceaccount.yaml
  - rbac/clusterrole.yaml
  - rbac/clusterrolebinding.yaml

  # PostgreSQL
  - postgresql/secret.yaml
  - postgresql/pvc.yaml
  - postgresql/deployment.yaml
  - postgresql/service.yaml

  # Backend
  - backend/secret.yaml
  - backend/configmap.yaml
  - backend/configmap-argocd.yaml
  - backend/deployment.yaml
  - backend/service.yaml

  # Frontend
  - frontend/deployment.yaml
  - frontend/service.yaml

  # Route (OpenShift) — comment out ingress.yaml when deploying on OCP
  # - ingress.yaml
  - route.yaml

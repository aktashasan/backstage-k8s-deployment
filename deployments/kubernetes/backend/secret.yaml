apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: backstage
type: Opaque
stringData:
  # GitHub Integration
  GITHUB_TOKEN: "your-github-token-here"
  
  # Azure DevOps Integration
  AZURE_DEVOPS_TOKEN: "your-azure-devops-token-here"
  AZURE_DEVOPS_HOST: "YOUR_AZURE_DEVOPS_HOST"
  
  # GitLab Integration
  GITLAB_TOKEN: "YOUR_GITLAB_TOKEN"
  
  # Harbor Registry
  HARBOR_URL: "https://YOUR_HARBOR_HOST"
  HARBOR_USERNAME: "Admin"
  HARBOR_PASSWORD: "YOUR_HARBOR_PASSWORD"
  
  # Kubernetes Cluster Tokens (optional)
  DEV_CLUSTER_TOKEN: ""
  TEST_CLUSTER_TOKEN: ""
  PROD_CLUSTER_TOKEN: ""
  OPENSHIFT_ITERATE_TOKEN: ""

  # OpenShift Production cluster (fill in after applying rbac/serviceaccount.yaml)
  # Retrieve token: oc get secret backstage-sa-token -n backstage -o jsonpath='{.data.token}' | base64 -d
  OPENSHIFT_PROD_URL: "https://YOUR_OPENSHIFT_API_URL"
  OPENSHIFT_PROD_TOKEN: ""
  # CA data: oc get secret backstage-sa-token -n backstage -o jsonpath='{.data.ca\.crt}'
  OPENSHIFT_PROD_CA_DATA: ""
  OPENSHIFT_PROD_CONSOLE_URL: "https://YOUR_OPENSHIFT_CONSOLE_URL"

  # Azure DevOps organization (used by azureDevOps plugin)
  AZURE_DEVOPS_ORG: "YOUR_ORG_NAME"

  # TechDocs — Azure Blob Storage
  AZURE_STORAGE_ACCOUNT_NAME: ""
  AZURE_STORAGE_ACCOUNT_KEY: ""
  TECHDOCS_AZURE_CONTAINER_NAME: "techdocs"

  # Shared auth secret for Backstage backend (must be identical on all pods)
  BACKEND_SECRET: "YOUR_BACKEND_SECRET"

# API Definitions
# Microservice'ler arası API tanımları

---
# User API
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: user-api
  title: User Management API
  description: RESTful API for user authentication and profile management
  tags:
    - rest
    - authentication
    - users
  links:
    - url: https://YOUR_API_HOST/users/swagger
      title: Swagger UI
      icon: docs
spec:
  type: openapi
  lifecycle: production
  owner: backend-team
  system: microservices-platform
  definition: |
    openapi: 3.0.0
    info:
      title: User Management API
      version: 1.0.0
      description: API for user operations
    servers:
      - url: https://YOUR_API_HOST/users
        description: Production
    paths:
      /users:
        get:
          summary: List users
          tags: [Users]
          responses:
            '200':
              description: Successful response
        post:
          summary: Create user
          tags: [Users]
          responses:
            '201':
              description: User created
      /users/{id}:
        get:
          summary: Get user by ID
          tags: [Users]
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Successful response
      /auth/login:
        post:
          summary: User login
          tags: [Authentication]
          responses:
            '200':
              description: Login successful


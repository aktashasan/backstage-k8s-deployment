# Team & User Definitions
# Organizasyonel yapı - Takımlar ve Kullanıcılar

---
# Platform Team
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  title: Platform Engineering Team
  description: Responsible for platform infrastructure, IDP, CI/CD, and developer tools
  tags:
    - platform
    - devops
    - sre
spec:
  type: team
  profile:
    displayName: Platform Engineering Team
    email: platform-team@company.com
    picture: https://avatars.githubusercontent.com/u/platform-team
  children: []

---
# Development Team
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: development-team
  title: Development Team
  description: Application development team for microservices
  tags:
    - development
    - backend
    - frontend
spec:
  type: team
  profile:
    displayName: Development Team
    email: dev-team@company.com
  children:
    - backend-team
    - frontend-team
    - mobile-team


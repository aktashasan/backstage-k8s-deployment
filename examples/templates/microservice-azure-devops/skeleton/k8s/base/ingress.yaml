{%- if values.enableIngress %}
{%- if values.clusterType == 'openshift' %}
# OpenShift Route
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ${{ values.component_id }}
  labels:
    app: ${{ values.component_id }}
spec:
  host: ${{ values.component_id }}.apps.company.com
  to:
    kind: Service
    name: ${{ values.component_id }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{%- else %}
# Kubernetes Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ values.component_id }}
  labels:
    app: ${{ values.component_id }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${{ values.component_id }}.company.com
    secretName: ${{ values.component_id }}-tls
  rules:
  - host: ${{ values.component_id }}.company.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ${{ values.component_id }}
            port:
              number: 80
{%- endif %}
{%- endif %}

# =============================================================================
# Harbor Registry Pull Secret
#
# Bu secret hem frontend hem backend deployment'ın imagePullSecrets kısmında
# referans edilir. Apply etmeden önce değerleri doldurun:
#
#   HARBOR_USERNAME: Harbor kullanıcı adı
#   HARBOR_PASSWORD: Harbor şifresi veya robot token
#
# Ya da doğrudan oc komutuyla da oluşturabilirsiniz:
#   oc create secret docker-registry harbor-registry-secret \
#     --docker-server=YOUR_HARBOR_HOST \
#     --docker-username=<USERNAME> \
#     --docker-password=<PASSWORD> \
#     -n backstage
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: harbor-registry-secret
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: registry-secret
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "YOUR_HARBOR_HOST": {
          "username": "HARBOR_USERNAME_BURAYA",
          "password": "HARBOR_PASSWORD_BURAYA",
          "auth": ""
        }
      }
    }

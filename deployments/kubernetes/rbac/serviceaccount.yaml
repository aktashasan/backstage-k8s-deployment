# =============================================================================
# Backstage ServiceAccount for OpenShift cluster access
#
# OpenShift 4.11+ does NOT auto-create SA token secrets.
# We create a long-lived token Secret explicitly, then populate
# OPENSHIFT_PROD_TOKEN from it:
#
#   oc apply -f serviceaccount.yaml
#   oc get secret backstage-sa-token -n backstage \
#     -o jsonpath='{.data.token}' | base64 -d
#
# Paste the decoded token into your backstage-secrets Secret as:
#   OPENSHIFT_PROD_TOKEN: "<token>"
#
# NOTE: Namespace is created by ../namespace.yaml — not here.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/part-of: backstage
---
# Long-lived token Secret for OpenShift 4.11+ (where SA tokens are no longer
# auto-mounted as permanent Secrets). Kubernetes/OCP populates .data.token
# automatically once the SA exists.
apiVersion: v1
kind: Secret
metadata:
  name: backstage-sa-token
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: sa-token
  annotations:
    kubernetes.io/service-account.name: backstage
type: kubernetes.io/service-account-token

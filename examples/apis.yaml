---
# Mobile GraphQL API
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mobile-graphql-api
  title: Mobile GraphQL API
  description: GraphQL API for mobile applications
  tags:
    - graphql
    - mobile
    - bff
spec:
  type: graphql
  lifecycle: production
  owner: mobile-team
  system: microservices-platform
  definition: |
    type Query {
      user(id: ID!): User
      orders(userId: ID!): [Order]
      notifications(userId: ID!): [Notification]
    }
    
    type Mutation {
      createOrder(input: OrderInput!): Order
      updateProfile(input: ProfileInput!): User
      markNotificationRead(id: ID!): Notification
    }
    
    type User {
      id: ID!
      email: String!
      name: String!
      orders: [Order]
    }
    
    type Order {
      id: ID!
      status: OrderStatus!
      items: [OrderItem]
      total: Float!
    }
    
    enum OrderStatus {
      PENDING
      CONFIRMED
      SHIPPED
      DELIVERED
    }

---
# Metrics API (Prometheus)
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: prometheus-metrics-api
  title: Prometheus Metrics API
  description: Prometheus metrics exposition format
  tags:
    - prometheus
    - metrics
    - monitoring
spec:
  type: prometheus
  lifecycle: production
  owner: platform-team
  system: observability
  definition: |
    # HELP http_requests_total Total HTTP requests
    # TYPE http_requests_total counter
    http_requests_total{method="GET",endpoint="/api/users"} 1234
    
    # HELP http_request_duration_seconds HTTP request duration
    # TYPE http_request_duration_seconds histogram
    http_request_duration_seconds_bucket{le="0.1"} 100

---
# vSphere API
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: vsphere-api
  title: vSphere Management API
  description: GraphQL API for vSphere infrastructure management
  tags:
    - graphql
    - vsphere
    - vmware
    - infrastructure
spec:
  type: graphql
  lifecycle: production
  owner: platform-team
  system: kubernetes-infrastructure
  definition: |
    type Query {
      virtualMachines: [VirtualMachine]
      virtualMachine(id: ID!): VirtualMachine
      templates: [Template]
      storagePolicies: [StoragePolicy]
    }
    
    type Mutation {
      createVirtualMachine(input: VMCreateInput!): VirtualMachine
      updateVirtualMachine(id: ID!, input: VMUpdateInput!): VirtualMachine
      deleteVirtualMachine(id: ID!): Boolean
    }
    
    type VirtualMachine {
      id: ID!
      name: String!
      status: VMStatus!
      cpu: Int!
      memory: Int!
      disks: [Disk]
      nics: [NetworkInterface]
    }
    
    enum VMStatus {
      POWERED_ON
      POWERED_OFF
      SUSPENDED
    }


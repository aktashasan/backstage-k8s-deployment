apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: audit-mgmt
  title: Audit Management
  description: Audit logging and management service for tracking system activities
  tags:
    - microservice
    - audit
    - logging
    - security
  annotations:
    backstage.io/kubernetes-id: crystal-audit-mgmt
    backstage.io/kubernetes-namespace: crystal
    backstage.io/kubernetes-label-selector: 'app=audit-mgmt'
    backstage.io/techdocs-ref: dir:.
    prometheus.io/scrape: 'true'
    prometheus.io/port: '3000'
  links:
    - url: https://YOUR_GITLAB_NAMESPACE/audit-mgmt
      title: Source Code
      icon: code
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: microservices-platform
  providesApis:
    - api:default/audit-api
  dependsOn:
    - resource:postgresql-shared

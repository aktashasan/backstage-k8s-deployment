apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: role-mgmt
  title: Role Management
  description: Role and user role assignment management service
  tags:
    - microservice
    - roles
    - rbac
    - security
  annotations:
    backstage.io/kubernetes-id: crystal-role-mgmt
    backstage.io/kubernetes-namespace: crystal
    backstage.io/kubernetes-label-selector: 'app=role-mgmt'
    backstage.io/techdocs-ref: dir:.
    prometheus.io/scrape: 'true'
    prometheus.io/port: '3000'
  links:
    - url: https://YOUR_GITLAB_NAMESPACE/role-mgmt
      title: Source Code
      icon: code
spec:
  type: service
  lifecycle: production
  owner: security-team
  system: microservices-platform
  providesApis:
    - api:default/auth-api
  dependsOn:
    - resource:postgresql-shared

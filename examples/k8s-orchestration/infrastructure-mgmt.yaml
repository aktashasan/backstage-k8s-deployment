apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: infrastructure-mgmt
  title: Infrastructure Management
  description: Infrastructure provisioning and management service
  tags:
    - microservice
    - infrastructure
    - provisioning
    - management
  annotations:
    backstage.io/kubernetes-id: crystal-infrastructure-mgmt
    backstage.io/kubernetes-namespace: crystal
    backstage.io/kubernetes-label-selector: 'app=infrastructure-mgmt'
    backstage.io/techdocs-ref: dir:.
    prometheus.io/scrape: 'true'
    prometheus.io/port: '3000'
  links:
    - url: https://YOUR_GITLAB_NAMESPACE/infrastructure-mgmt
      title: Source Code
      icon: code
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: kubernetes-infrastructure
  providesApis:
    - api:default/infrastructure-api
  dependsOn:
    - resource:postgresql-shared

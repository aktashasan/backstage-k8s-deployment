apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-frontend
  namespace: backstage
  labels:
    app: backstage-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backstage-frontend
  template:
    metadata:
      labels:
        app: backstage-frontend
    spec:
      containers:
      - name: frontend
        image: YOUR_HARBOR_HOST/backstage/backstage-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: APP_BASE_URL
          value: "http://YOUR_BACKSTAGE_DOMAIN"
        - name: BACKEND_BASE_URL
          value: "http://YOUR_BACKSTAGE_DOMAIN"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
      imagePullSecrets:
      - name: harbor-registry-secret

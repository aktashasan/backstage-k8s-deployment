# Resource Definitions - Infrastructure Components
# Kubernetes Clusters, Databases, Message Queues, etc.

---
# Dev Kubernetes Cluster
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: kubernetes-dev-cluster
  title: Development Kubernetes Cluster
  description: Development environment Kubernetes cluster
  tags:
    - kubernetes
    - dev
    - development
    - openshift
  annotations:
    kubernetes.io/cluster-name: dev-cluster
    kubernetes.io/api-server: https://api.dev-cluster.company.com
    kubernetes.io/version: v1.28.5
    backstage.io/kubernetes-id: dev-cluster
  links:
    - url: https://rancher.company.com/c/dev-cluster
      title: Rancher Dashboard
      icon: dashboard
    - url: https://console-openshift-console.apps.dev-cluster.company.com
      title: OpenShift Console
      icon: dashboard
spec:
  type: kubernetes-cluster
  owner: platform-team
  system: kubernetes-infrastructure
  dependsOn:
    - resource:harbor-dev-registry


# Azure DevOps Pipeline - Main
# Generated by Backstage
# Microservice: ${{ values.component_id }}
#
# ÖNEMLİ: Bu dosya Backstage Template Engine tarafından işlenir!
# Backstage scaffolder bu dosyayı işlerken:
# - Dil (language) alanına göre ilgili blokları seçer
# - Sadece seçilen dil için gerekli task'lar kalır, diğerleri silinir
# - values içindeki alanları (ör. component_id, harborProject) gerçek değerlerle değiştirir
#
# Bu dosyayı DOĞRUDAN Azure DevOps'a yüklemeyin!
# Backstage template'inden oluşturulan projede zaten işlenmiş hali olacak.

trigger:
  branches:
    include:
      - dev
      - main
      - release/*
  paths:
    exclude:
      - README.md
      - docs/*

pr: none

variables:
  # Build Variables
  componentId: '${{ values.component_id }}'
  componentName: '${{ values.component_id }}'
  buildConfiguration: 'Release'
  
  # Container Registry
  dockerRegistry: 'harbor.company.com'
  harborProject: '${{ values.harborProject }}'
  imageName: '$(harborProject)/$(componentId)'
  imageTag: '$(Build.BuildId)'
  
  # Nexus Configuration
  nexusUrl: 'https://nexus.company.com'
  nexusRepository: '${{ values.nexusRepository }}'
  
  # Kubernetes
  kubernetesNamespace: '${{ values.namespace }}'
  
  # Security Scanning
  enableImageScan: ${{ values.enableImageScan }}
  enableSonarQube: ${{ values.enableSonarQube }}
  enableFortify: ${{ values.enableFortify }}

stages:
  # Stage 1: Code Build
  - stage: Build
    displayName: 'Code Build'
    jobs:
      - job: BuildJob
        displayName: 'Build Application'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 0
            clean: true

          {%- if values.language == 'java' %}
          - task: Maven@4
            displayName: 'Maven Build'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean package -DskipTests'
              options: '-B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn'
              publishJUnitResults: false
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '17'
              mavenVersionOption: 'Default'
              
          {%- elif values.language == 'dotnet' %}
          - task: DotNetCoreCLI@2
            displayName: 'dotnet build'
            inputs:
              command: 'build'
              projects: '**/*.csproj'
              arguments: '--configuration $(buildConfiguration)'
              
          {%- elif values.language == 'nodejs' %}
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '20.x'
          
          - script: |
              npm ci
              npm run build
            displayName: 'npm install and build'
            
          {%- elif values.language == 'python' %}
          - task: UsePythonVersion@0
            displayName: 'Use Python 3.11'
            inputs:
              versionSpec: '3.11'
          
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install dependencies'
            
          {%- elif values.language == 'go' %}
          - task: GoTool@0
            displayName: 'Install Go'
            inputs:
              version: '1.22'
          
          - script: |
              go mod download
              go build -v -o bin/$(componentId) ./cmd/main.go
            displayName: 'Go build'
          {%- endif %}

          - publish: $(System.DefaultWorkingDirectory)
            artifact: BuildArtifact
            displayName: 'Publish Build Artifact'

  # Stage 2: Code Test
  - stage: Test
    displayName: '🧪 Code Test'
    dependsOn: Build
    jobs:
      - job: TestJob
        displayName: 'Run Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - download: current
            artifact: BuildArtifact
            
          {%- if values.language == 'java' %}
          - task: Maven@4
            displayName: 'Run Unit Tests'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'test'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              codeCoverageToolOption: 'JaCoCo'
              
          {%- elif values.language == 'dotnet' %}
          - task: DotNetCoreCLI@2
            displayName: 'Run Tests'
            inputs:
              command: 'test'
              projects: '**/*Tests/*.csproj'
              arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage"'
              
          {%- elif values.language == 'nodejs' %}
          - script: |
              npm test -- --coverage --ci
            displayName: 'Run Jest Tests'
            
          {%- elif values.language == 'python' %}
          - script: |
              pip install pytest pytest-cov
              pytest --cov=. --cov-report=xml --cov-report=html
            displayName: 'Run Pytest'
            
          {%- elif values.language == 'go' %}
          - script: |
              go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
            displayName: 'Run Go Tests'
          {%- endif %}

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish Code Coverage'
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)'

  # Stage 3: Code Security Scan
  {%- if values.enableSonarQube %}
  - stage: CodeSecurity
    displayName: '🔒 Code Security'
    dependsOn: Test
    jobs:
      - job: SonarQubeJob
        displayName: 'SonarQube Analysis'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: SonarQubePrepare@6
            displayName: 'Prepare SonarQube'
            inputs:
              SonarQube: 'SonarQube-Connection'
              scannerMode: 'CLI'
              configMode: 'manual'
              cliProjectKey: '$(componentId)'
              cliProjectName: '$(componentId)'
              cliSources: 'src'

          - task: SonarQubeAnalyze@6
            displayName: 'Run SonarQube Analysis'

          - task: SonarQubePublish@6
            displayName: 'Publish Quality Gate Result'
            inputs:
              pollingTimeoutSec: '300'
  {%- endif %}

  # Stage 4: Image Build
  - stage: ImageBuild
    displayName: 'Image Build'
    dependsOn: 
      - Test
      {%- if values.enableSonarQube %}
      - CodeSecurity
      {%- endif %}
    jobs:
      - job: DockerBuildJob
        displayName: 'Build Docker Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - download: current
            artifact: BuildArtifact

          - task: Docker@2
            displayName: 'Build Docker Image'
            inputs:
              containerRegistry: 'Harbor-Registry'
              repository: '$(imageName)'
              command: 'build'
              Dockerfile: '$(System.DefaultWorkingDirectory)/Dockerfile'
              tags: |
                $(imageTag)
                latest
              arguments: '--build-arg VERSION=$(imageTag)'

          - task: Docker@2
            displayName: 'Push to Harbor'
            inputs:
              containerRegistry: 'Harbor-Registry'
              repository: '$(imageName)'
              command: 'push'
              tags: |
                $(imageTag)
                latest

  # Stage 5: Image Scan
  {%- if values.enableImageScan %}
  - stage: ImageScan
    displayName: '🛡️ Image Security Scan'
    dependsOn: ImageBuild
    jobs:
      - job: TrivyScanJob
        displayName: 'Trivy Scan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              # Install Trivy
              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
              echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
              sudo apt-get update
              sudo apt-get install trivy -y
              
              # Scan Image
              trivy image --severity HIGH,CRITICAL \
                --format json --output trivy-results.json \
                $(dockerRegistry)/$(imageName):$(imageTag)
              
              # Generate HTML Report
              trivy image --severity HIGH,CRITICAL \
                --format template --template "@contrib/html.tpl" \
                --output trivy-report.html \
                $(dockerRegistry)/$(imageName):$(imageTag)
            displayName: 'Run Trivy Scan'
            env:
              TRIVY_USERNAME: $(HARBOR_USERNAME)
              TRIVY_PASSWORD: $(HARBOR_PASSWORD)

          - publish: $(System.DefaultWorkingDirectory)/trivy-report.html
            artifact: TrivyReport
            displayName: 'Publish Trivy Report'

          - script: |
              # Check if critical vulnerabilities exist
              CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
              if [ "$CRITICAL" -gt 0 ]; then
                echo "##vso[task.logissue type=error]Found $CRITICAL critical vulnerabilities!"
                exit 1
              fi
            displayName: 'Validate Security Threshold'
  {%- endif %}

  # Stage 6: Artifact Push to Nexus
  - stage: ArtifactPush
    displayName: '📦 Push to Nexus'
    dependsOn: 
      - ImageBuild
      {%- if values.enableImageScan %}
      - ImageScan
      {%- endif %}
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - job: NexusPushJob
        displayName: 'Push Artifacts'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          {%- if values.language == 'java' %}
          - task: Maven@4
            displayName: 'Deploy to Nexus'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'deploy -DskipTests'
              options: '-DaltDeploymentRepository=nexus::default::$(nexusUrl)/repository/$(nexusRepository)'
              publishJUnitResults: false
          {%- else %}
          - script: |
              echo "Artifact push to Nexus for ${{ values.language }}"
              # Add language-specific artifact push logic
            displayName: 'Push to Nexus'
          {%- endif %}

  # Stage 7: Deploy Summary
  - stage: Summary
    displayName: '📋 Build Summary'
    dependsOn: ArtifactPush
    jobs:
      - job: SummaryJob
        displayName: 'Generate Summary'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "=========================================="
              echo "Build Summary"
              echo "=========================================="
              echo "Component: $(componentId)"
              echo "Image: $(dockerRegistry)/$(imageName):$(imageTag)"
              echo "Build ID: $(Build.BuildId)"
              echo "Branch: $(Build.SourceBranchName)"
              echo "Commit: $(Build.SourceVersion)"
              echo "=========================================="
            displayName: 'Print Summary'

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kubeapps-proxy
  title: Kubeapps Proxy
  description: Proxy service for Kubeapps Kubernetes application management dashboard
  tags:
    - microservice
    - proxy
    - kubernetes
    - dashboard
    - kubeapps
  annotations:
    backstage.io/kubernetes-id: crystal-kubeapps-proxy
    backstage.io/kubernetes-namespace: crystal
    backstage.io/kubernetes-label-selector: 'app=kubeapps-proxy'
    backstage.io/techdocs-ref: dir:.
    prometheus.io/scrape: 'true'
    prometheus.io/port: '8080'
  links:
    - url: https://YOUR_GITLAB_NAMESPACE/kubeapps-proxy
      title: Source Code
      icon: code
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: kubernetes-infrastructure
  dependsOn:
    - resource:kubernetes-dev-cluster
